name: build-windows-exe

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path 'requirements.txt') { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build onefile GUI exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SPPToolkit `
            spp_toolkit_enhanced.py
          if (-not (Test-Path 'dist/SPPToolkit.exe')) { throw 'EXE not produced' }

      - name: Zip artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path dist/SPPToolkit.exe -DestinationPath artifacts/SPPToolkit.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPPToolkit-windows
          path: artifacts/SPPToolkit.zip
